{% extends "base.html" %}
{% block title %}Entrar – Gincana UP{% endblock %}
{% block content %}
<div class="container" style="padding-top:32px;">
    <div class="login-brand">
        <img src="{{ url_for('static', filename='brand/logo-up.png') }}" alt="UP Centro Educacional">
    </div>

    <div class="login-title">
        <div class="school">UP CENTRO EDUCACIONAL</div>
        <h2>🏆 Gincana 2026</h2>
    </div>

    <div class="card">
        <p style="color:var(--muted); font-size:13px; text-align:center; margin-bottom:16px;">
            Acesse para avaliar as equipes
        </p>

        <form method="POST" action="{{ url_for('login') }}">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com" required autofocus>

            <label>Senha</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">
                Entrar
            </button>
        </form>

        <p style="margin-top:16px; text-align:center;">
            <a href="{{ url_for('ranking') }}" style="color:var(--up-red); font-size:13px; font-weight:600; text-decoration:none;">
                🏆 Ver ranking público
            </a>
        </p>
    </div>

    <img class="brand-hero" src="{{ url_for('static', filename='brand/unidade.jpg') }}" alt="Unidade UP">
</div>
{% endblock %}
